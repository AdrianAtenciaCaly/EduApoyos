@if (auth.isLoggedIn()) {
<header class="main-header">
  <div class="header-container">
    <div class="logo-area">
      <span class="logo-text">EduApoyos</span>
      <span class="logo-dot"></span>
    </div>
    
    <nav class="nav-links">
      @if (auth.isAdvisor()) {
      <a routerLink="/advisor" routerLinkActive="active" class="nav-item">
        <span class="material-icons nav-icon">people</span>
        <span>Estudiantes</span>
      </a>
      <a routerLink="/support-requests" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
        <span class="material-icons nav-icon">receipt_long</span>
        <span>Solicitudes</span>
      </a>
      <a routerLink="/support-requests/new" routerLinkActive="active" class="nav-item">
        <span class="material-icons nav-icon">add_circle_outline</span>
        <span>Nueva Solicitud</span>
      </a>
      }
      @if (auth.isStudent()) {
      <a routerLink="/student" routerLinkActive="active" class="nav-item">
        <span class="material-icons nav-icon">space_dashboard</span>
        <span>Mi Portal</span>
      </a>
      }
    </nav>
    
    <div class="user-profile">
      <div class="profile-info">
        <span class="profile-name">{{ auth.getFullName() }}</span>
        <span class="profile-role">{{ auth.getRole() }}</span>
      </div>
      <button (click)="auth.logout()" class="logout-btn" title="Cerrar sesión">
        <span class="material-icons">logout</span>
      </button>
    </div>
  </div>
</header>
}
<main class="container">
  <router-outlet />
</main>
