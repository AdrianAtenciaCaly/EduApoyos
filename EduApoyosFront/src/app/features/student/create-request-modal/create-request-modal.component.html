<div class="modal-backdrop" (click)="onBackdropClick()"></div>

<div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="create-title"
    (click)="$event.stopPropagation()">
    <div class="dialog-container">
        <div class="dialog-header">
            <div class="dialog-header-content">
                <h2 id="create-title">Crear solicitud de apoyo</h2>
                <p>Completa los datos de tu solicitud. El estado inicial será Pendiente.</p>
            </div>
            <button mat-icon-button type="button" class="close-button" (click)="close()" aria-label="Cerrar">
                <span class="material-icons">close</span>
            </button>
        </div>

        <div class="dialog-body">
            @if (error) {
            <div class="feedback-error">{{ error }}</div>
            }

            <form class="form" [formGroup]="form" (ngSubmit)="submit()">
                <mat-form-field appearance="outline" class="full" floatLabel="always">
                    <mat-label>Tipo de apoyo</mat-label>
                    <mat-select formControlName="type" panelClass="edu-select-panel">
                        <mat-option value="Scholarship">Beca</mat-option>
                        <mat-option value="Credit">Crédito</mat-option>
                        <mat-option value="Subsidy">Subsidio</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full" floatLabel="always">
                    <mat-label>Monto solicitado</mat-label>
                    <input matInput type="number" formControlName="requestedAmount" min="1" placeholder="Ej: 1500000" />
                </mat-form-field>

                <mat-form-field appearance="outline" class="full" floatLabel="always">
                    <mat-label>Descripción</mat-label>
                    <textarea matInput rows="4" formControlName="description"
                        placeholder="Describe el motivo de tu solicitud"></textarea>
                </mat-form-field>

                <div class="dialog-actions">
                    <button mat-stroked-button type="button" (click)="close()" [disabled]="saving">
                        Cerrar
                    </button>
                    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || saving">
                        {{ saving ? 'Enviando…' : 'Enviar solicitud' }}
                    </button>
                </div>
            </form>
        </div>
